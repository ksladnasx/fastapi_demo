<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastAPI 招聘信息面板</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <header class="topbar">
          <div>
            <h1>FastAPI 招聘信息面板</h1>
            <p>导入 GivemeOC 招聘数据，查询已入库的公司官网和招聘链接。</p>
          </div>
          <label class="api-url">
            API 地址
            <input id="apiBaseUrl" type="url" value="http://127.0.0.1:8000" />
          </label>
        </header>

        <section class="job-toolbar">
          <div class="filters">
            <label>关键词<input id="jobKeyword" placeholder="公司、职位、摘要" /></label>
            <label>地点<input id="jobLocation" placeholder="例如 Hong Kong" /></label>
            <label>状态<input id="jobStatus" placeholder="例如 Open" /></label>
            <label>每页数量<input id="jobPageSize" type="number" min="1" max="100" value="20" /></label>
          </div>
          <div class="actions">
            <button id="loadJobsBtn" type="button">查询招聘信息</button>
            <button id="prevJobsBtn" type="button" class="secondary">上一页</button>
            <button id="nextJobsBtn" type="button" class="secondary">下一页</button>
          </div>
          <div class="import-row">
            <label>导入页数<input id="importPages" type="number" min="1" max="100" value="30" /></label>
            <label>起始页<input id="importStartPage" type="number" min="1" value="1" /></label>
            <button id="importJobsBtn" type="button">爬取并入库</button>
            <span id="jobMeta">等待查询</span>
          </div>
        </section>

        <section class="jobs-section">
          <div id="jobsList" class="jobs-list">
            <div class="empty-state">还没有加载招聘信息。</div>
          </div>
        </section>

        <div class="grid">
          <section class="panel">
            <h2>注册</h2>
            <div class="form-grid">
              <label>用户名<input id="registerUsername" value="newuser" /></label>
              <label>邮箱<input id="registerEmail" value="newuser@example.com" /></label>
              <label>姓名<input id="registerFullName" value="New User" /></label>
              <label>密码<input id="registerPassword" type="password" value="newuser123" /></label>
            </div>
            <button id="registerBtn" type="button">发送注册请求</button>
          </section>

          <section class="panel">
            <h2>登录</h2>
            <div class="form-grid">
              <label>用户名或邮箱<input id="loginUsername" value="admin" /></label>
              <label>密码<input id="loginPassword" type="password" value="admin123" /></label>
            </div>
            <button id="loginBtn" type="button">登录并保存 token</button>
          </section>

          <section class="panel token-panel">
            <h2>当前 Token</h2>
            <textarea id="tokenBox" spellcheck="false" placeholder="登录成功后会自动填入 access_token"></textarea>
            <div class="actions">
              <button id="saveTokenBtn" type="button">保存 token</button>
              <button id="clearTokenBtn" type="button" class="secondary">清空 token</button>
            </div>
          </section>

          <section class="panel">
            <h2>带认证请求</h2>
            <div class="actions vertical">
              <button id="meBtn" type="button">GET /user/me</button>
              <button id="usersBtn" type="button">GET /user/get_users</button>
            </div>
            <div class="request-preview">
              <span>本次认证头</span>
              <code id="authHeader">Authorization: Bearer 未设置</code>
            </div>
          </section>
        </div>

        <section class="console-panel">
          <div class="console-head">
            <h2>请求结果</h2>
            <button id="clearLogBtn" type="button" class="secondary">清空结果</button>
          </div>
          <pre id="resultLog">等待操作...</pre>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
